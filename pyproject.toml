[project]
name = "python-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guilherme", email = "guilherme.tr.silva@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "transformers>=5.17.0",
]

[project.scripts]
python-lab = "python_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
